[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyagentos"
version = "0.1.0"
description = "Production-grade multi-agent AI framework running on Phi-3 Mini (GGUF)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["core*", "agents*", "infrastructure*", "storage*", "api*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]
# Relaxed from strict's defaults while the codebase is still moving fast
# day-to-day (annotating everything now just means re-annotating again
# as files keep changing). These three account for the bulk of current
# mypy noise (missing return/arg annotations, unparameterized generics
# like bare `dict`) without disabling the checks that catch real bugs --
# arg-type mismatches, implicit-Optional, unsafe None operations, etc.
# all stay active. Revisit and re-tighten during a dedicated hardening
# pass (see plan Days 24 / 28-29) once the core design has settled.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
# Day 24: silenced pending review of the 6 flagged no-any-return sites
# (infrastructure/auth.py, agents/summarizer.py, core/agent.py) -- these
# come from untyped/third-party return values propagating as Any, not
# from bugs identified so far. Remove this once those call sites get
# explicit casts/annotations instead of a blanket suppression.
disable_error_code = ["no-any-return"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=. --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["."]
# Registers the 'slow' marker (previously used in
# tests/unit/test_security_day28.py and now also
# tests/integration/test_deployment_smoke.py's real-inference tests
# without ever being declared here, hence the long-standing
# PytestUnknownMarkWarning on every run). Real-inference tests share
# LLMRuntime's single _inference_lock (WORKERS=1) with every other
# test in the same session -- run back-to-back with 280+ other tests,
# they inherit whatever lock contention/backlog those left behind,
# which is a real source of session-order-dependent flakiness (see the
# 2026-08-15 flake: a Ctrl+C'd run left an orphaned generate() call
# running server-side, and the next full run's full_pipeline tests
# queued up behind it and hit their timeout).
#
# Default CI/dev loop: `pytest -m "not slow"` -- fast, deterministic,
# no real inference.
# Separate pass against a freshly-started container:
# `pytest -m slow` -- exercises real concurrent inference without
# competing with 280 unrelated tests for the same lock.
markers = [
    "slow: real-inference / real-container tests; run separately from the main suite (pytest -m slow)",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]