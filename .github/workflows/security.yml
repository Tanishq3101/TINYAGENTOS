name: Security

# CONSOLIDATED onto scripts/security_scan.sh rather than re-implementing
# bandit inline here -- the script is the more complete implementation
# (bandit + safety + OWASP dependency-check, with graceful degradation
# if a tool isn't installed) and was previously NOT being called by
# this workflow at all, meaning CI was running a thinner duplicate of
# it. Same category of problem SECURITY.md already flags for
# verify_api_key()'s two implementations: fix the gap by making the
# better one the one that's actually wired in, not by maintaining both.
#
# `pip install safety` is added below specifically so the script's
# safety step actually executes in CI instead of hitting its own
# graceful "not found, skipping" branch -- locally that branch is a
# reasonable fallback; in CI there's no reason not to just have it.
#
# OWASP dependency-check runs via the official GitHub Action instead of
# the script's Java-CLI branch, which is more idiomatic for Actions and
# avoids scripting a Java install -- the script's own OWASP branch will
# still correctly skip itself in this environment since the CLI won't
# be on PATH, and this job supplies that coverage separately instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan, Monday 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: tinyagentos
          python-version: "3.11"

      - name: Install safety
        shell: bash -l {0}
        run: pip install safety

      - name: Run security_scan.sh (bandit + safety)
        shell: bash -l {0}
        run: bash scripts/security_scan.sh

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          if-no-files-found: warn

  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "TinyAgentOS"
          path: "."
          format: "JSON"

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}