name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker files
        run: |
          echo "Repository:"
          pwd
          ls -la

          echo "Docker directory:"
          ls -la docker/

          test -f docker/docker-compose.yml
          test -f docker/Dockerfile

          echo "Docker files found successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Security scan (bandit)
        run: |
          # -ll = only fail the build on Medium or High severity findings.
          # Low-severity findings (e.g. try/except/pass fallback patterns,
          # the intentional unreachable `assert` in infrastructure/retry.py)
          # are still reported in the JSON output below but do NOT fail CI.
          bandit -r core/ agents/ infrastructure/ api/ -ll -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          # Bandit above is SAST -- it checks code patterns, not known
          # CVEs in pinned dependency versions. pip-audit checks
          # requirements.txt's exact pins against the PyPI advisory
          # database. Not using -ll here: unlike bandit's severity
          # levels, a pip-audit finding means a specific pinned version
          # has a *known, published* CVE -- there's no "low severity,
          # ignore it" tier to carve out the way bandit has for
          # stylistic findings, so any hit fails the build.
          pip-audit -r requirements.txt --desc

      - name: Ensure SQLite db file exists
        run: |
          # FIX: docker-compose.yml bind-mounts ../tinyagentos.db as a
          # FILE (`- ../tinyagentos.db:/app/tinyagentos.db`). If that
          # path doesn't exist on the host -- true for every fresh CI
          # checkout, since this is a runtime artifact and correctly
          # not committed -- Docker silently creates a DIRECTORY there
          # instead, both inside the container and on the host. That
          # breaks sqlite3 in the container ("unable to open database
          # file") AND breaks every host-side pytest test that opens
          # the same relative sqlite:///./tinyagentos.db path afterward
          # (e.g. tests/e2e/test_complete_flow.py's TestClient), since
          # they now find a directory sitting there too.
          #
          # chmod 666 because the file is created here as the runner
          # user, but the container runs as appuser (uid 1000, see
          # Dockerfile) -- world-writable avoids a uid mismatch instead
          # of trying to guess/match uids across host and container.
          touch tinyagentos.db
          chmod 666 tinyagentos.db

      - name: Start Docker Compose
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
          # CI SMOKE-TEST FIX: without this, LLMRuntime.__init__ (in
          # core/llm_runtime.py) tries to load the real phi-3-mini.gguf,
          # which was never downloaded on the CI runner (models/ is
          # empty here) -- that crashed app startup on every single run.
          # This makes the container skip the model load and report
          # model_loaded: false on /health instead, so the smoke test
          # can actually verify "does the API boot and route requests"
          # without needing multi-GB weights in CI. Read by
          # docker-compose.yml's environment block, which passes it
          # through into the container.
          TINYAGENT_SKIP_LLM_LOAD: "1"
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            up -d --build

      - name: Show Docker Compose status
        if: always()
        run: |
          echo "===== DOCKER COMPOSE STATUS ====="
          docker compose \
            -f docker/docker-compose.yml \
            ps -a

          echo "===== ALL CONTAINERS ====="
          docker ps -a

      - name: Show Docker logs
        if: always()
        run: |
          echo "===== DOCKER COMPOSE LOGS ====="
          docker compose \
            -f docker/docker-compose.yml \
            logs --no-color

      - name: Wait for API
        run: |
          for i in {1..60}; do
            echo "Health check attempt $i/60"

            if response=$(curl -fsS http://localhost:8000/api/v1/health); then
              echo ""
              echo "========================================"
              echo "API IS READY"
              echo "========================================"
              # NOTE: prints model_loaded for visibility only -- it is
              # expected to be false here (TINYAGENT_SKIP_LLM_LOAD=1 was
              # set in the "Start Docker Compose" step above), and that
              # is NOT a failure. This step only checks that the API
              # process is up and routing requests, per Option A (see
              # core/llm_runtime.py) -- real inference is exercised by a
              # separate, model-backed integration job, not this smoke
              # test.
              echo "$response"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo ""
          echo "========================================"
          echo "API FAILED TO BECOME READY"
          echo "========================================"

          echo ""
          echo "===== DOCKER COMPOSE STATUS ====="
          docker compose \
            -f docker/docker-compose.yml \
            ps -a

          echo ""
          echo "===== DOCKER COMPOSE LOGS ====="
          docker compose \
            -f docker/docker-compose.yml \
            logs --no-color

          exit 1

      - name: Seed test API key
        run: |
          # FIX: tests/e2e/test_complete_flow.py and
          # tests/integration/test_deployment_smoke.py both authenticate
          # as API key "sk-test" (via TINYAGENTOS_TEST_API_KEY, defaulting
          # to "sk-test" -- see each file's docstring), but nothing has
          # ever inserted a matching row into api_keys. Locally this went
          # unnoticed because a real key had already been generated by
          # hand into a pre-existing tinyagentos.db and exported via that
          # env var -- CI starts from a fresh, empty database every run.
          #
          # REVISED: a hand-rolled `sqlite3` INSERT here previously failed
          # with "no such table: api_keys" -- storage/database.py's
          # init_db() is only called lazily (on first real DB-touching
          # request, e.g. an auth check) and is explicitly documented as
          # idempotent ("safe to call repeatedly"), so nothing guarantees
          # the table exists yet at this point in the workflow. Rather
          # than add a throwaway warmup request and hope table-creation
          # timing never changes, this uses the app's own Database class
          # and init_db() directly -- guaranteed to match the real schema
          # (columns, constraints, indexes) exactly, no duplication of
          # storage/models.py's definitions here. SecurityManager.hash_api_key
          # is the same hashing the app itself uses for lookups (SHA-256,
          # see infrastructure/security.py) -- this must match exactly or
          # the app's own auth lookup won't find the row.
          #
          # DATABASE_URL matches docker-compose.yml's container-side value
          # (sqlite:///./tinyagentos.db) -- run from the repo root, same as
          # every other step here, so this resolves to the same bind-mounted
          # file both the container and the host-side TestClient tests share.
          python3 -c "
          from storage.database import Database
          from infrastructure.security import SecurityManager

          db = Database('sqlite:///./tinyagentos.db')
          db.init_db()
          db.create_api_key(SecurityManager.hash_api_key('sk-test'), label='ci-test')
          print('Seeded CI test API key (sk-test).')
          "

      - name: Run tests with coverage
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
          # Same reasoning as the "Start Docker Compose" step above --
          # pytest runs directly on this runner, not inside the
          # container, but any test that imports api.app or
          # core.orchestrator (e.g. via TestClient) will trigger the
          # exact same LLMRuntime() model load on the host, where
          # models/ is equally empty. Without this, that import would
          # crash pytest collection/setup regardless of the Docker fix
          # above.
          TINYAGENT_SKIP_LLM_LOAD: "1"
        run: |
          pytest --cov=. \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            down -v