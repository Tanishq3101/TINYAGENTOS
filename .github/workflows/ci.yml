name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker Compose file
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Docker Compose files:"
          find . -maxdepth 3 \( \
            -name "docker-compose.yml" -o \
            -name "docker-compose.yaml" -o \
            -name "compose.yml" -o \
            -name "compose.yaml" \
          \) -print

          test -f docker-compose.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Start Docker Compose
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
        run: |
          docker compose -f docker-compose.yml up -d --build

      - name: Show Docker Compose status
        if: always()
        run: |
          echo "===== DOCKER COMPOSE STATUS ====="
          docker compose -f docker-compose.yml ps -a

          echo "===== ALL DOCKER CONTAINERS ====="
          docker ps -a

      - name: Show Docker logs after startup
        if: always()
        run: |
          echo "===== DOCKER COMPOSE LOGS ====="
          docker compose -f docker-compose.yml logs --no-color

      - name: Wait for API
        run: |
          for i in {1..60}; do
            echo "Health check attempt $i/60"

            if curl -fsS http://localhost:8000/api/v1/health; then
              echo ""
              echo "API is ready!"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo ""
          echo "========================================"
          echo "API FAILED TO BECOME READY"
          echo "========================================"

          echo ""
          echo "===== DOCKER COMPOSE STATUS ====="
          docker compose -f docker-compose.yml ps -a

          echo ""
          echo "===== DOCKER COMPOSE LOGS ====="
          docker compose -f docker-compose.yml logs --no-color

          exit 1

      - name: Run tests with coverage
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v