name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Docker Compose file
        run: |
          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          echo "Searching for Compose files..."
          find . -maxdepth 5 \( \
            -name "docker-compose.yml" -o \
            -name "docker-compose.yaml" -o \
            -name "compose.yml" -o \
            -name "compose.yaml" \
          \) -print

          COMPOSE_FILE=$(find . -maxdepth 5 \( \
            -name "docker-compose.yml" -o \
            -name "docker-compose.yaml" -o \
            -name "compose.yml" -o \
            -name "compose.yaml" \
          \) -print -quit)

          if [ -z "$COMPOSE_FILE" ]; then
            echo "ERROR: No Docker Compose file found!"
            exit 1
          fi

          echo "Found Compose file: $COMPOSE_FILE"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.20"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Start Docker Compose
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
        run: |
          echo "Using Compose file: $COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up -d --build

      - name: Show Docker Compose status
        run: |
          docker compose -f "$COMPOSE_FILE" ps

      - name: Show Docker logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" logs --no-color

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/v1/health; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API... ($i/60)"
            sleep 2
          done

          echo "API failed to become ready"

          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --no-color

          exit 1

      - name: Run tests with coverage
        env:
          SECRET_KEY: "test-secret-key-not-for-production-use-only-in-ci-32chars-min"
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" down -v