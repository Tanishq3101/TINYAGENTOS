<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — TinyAgentOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .error-wrap{
    min-height:60vh;display:flex;flex-direction:column;align-items:flex-start;
    justify-content:center;max-width:1180px;margin:0 auto;padding:32px;
  }
  .error-code{
    font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--cyan);
    letter-spacing:0.08em;margin-bottom:16px;
  }
  .error-title{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:32px;
    margin-bottom:16px;
  }
  .error-sub{color:var(--text-dim);max-width:460px;margin-bottom:28px;line-height:1.6;}
</style>
</head>
<body>

<header>
  <nav aria-label="Primary">
    <a class="logo" href="index.html"><span class="dot" aria-hidden="true"></span>tinyagentos</a>
  </nav>
</header>

<main>
  <div class="error-wrap">
    <p class="error-code">// 404 NOT FOUND</p>
    <h1 class="error-title">This route doesn't exist.</h1>
    <p class="error-sub">The page you're looking for isn't part of the site — check the URL, or head back and try again.</p>
    <a class="btn btn-primary" href="index.html">back to home</a>
  </div>
</main>

<footer>
  <span>tinyagentos // phase 1</span>
  <span><a href="https://github.com/your-org/tinyagentos">github</a> · <a href="docs.html">docs</a> · <a href="docs.html#deployment">security</a></span>
</footer>

</body>
</html>
