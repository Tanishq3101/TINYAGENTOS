# k8s/service.yaml
#
# ClusterIP by default -- internal-only. Nothing here assumes you have
# an ingress controller or cloud load balancer set up, since that
# wasn't specified. Two commented alternatives below if/when you decide
# how this should actually be reached from outside the cluster.

apiVersion: v1
kind: Service
metadata:
  name: tinyagentos
  labels:
    app: tinyagentos
spec:
  type: ClusterIP
  selector:
    app: tinyagentos
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

