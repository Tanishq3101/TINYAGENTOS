# Adapted from the 30-day plan's draft compose file with two real-code fixes:
#
#   1. Environment variable names now match infrastructure/config.py's
#      actual Settings fields (HOST, PORT, SECRET_KEY, LOG_LEVEL, DEBUG,
#      REQUIRE_AUTH, DATABASE_URL) instead of the draft's JWT_SECRET /
#      SERVER_HOST / SERVER_PORT, which don't exist as Settings fields --
#      pydantic-settings silently ignores unrecognized env var names and
#      falls back to field defaults, so those would have quietly done
#      nothing rather than erroring.
#   2. Removed the redis service — nothing in Settings, storage/, or
#      infrastructure/ currently talks to it, so there's still nothing
#      for it to do. The prometheus/grafana services below are back,
#      though: api/routes.py now exposes a real /metrics endpoint
#      (infrastructure/prometheus_metrics.py) that orchestrator.py
#      actually instruments, so there's something to scrape now.
#
# SECRET_KEY has no safe default in Settings (by design -- the app
# refuses to start without one, see config.py's field_validator). Put a
# real 32+ char value in a .env file at the project root; do not commit
# it. Generate one with:
#     python -c "import secrets; print(secrets.token_urlsafe(64))"
#
# Because this compose file lives in docker/ but the project's .env
# lives at the project root, run it with an explicit --env-file from the
# project root:
#     docker compose -f docker/docker-compose.yml --env-file .env up --build

services:
  tinyagentos:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "8000:8000"

    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - REQUIRE_AUTH=true
      - MODEL_PATH=/app/models/phi-3-mini.gguf
      - DATABASE_URL=sqlite:///./tinyagentos.db
      - SECRET_KEY=${SECRET_KEY}
      # FIX: was missing entirely -- config.py's FERNET_KEY defaults to
      # None when unset, and nothing in this file was passing it through
      # from the host .env. That meant SecurityManager's encryption-at-
      # rest path was silently inactive in any docker-compose deployment,
      # even though the code for it exists and even though the Day 28
      # checklist marks encryption at rest as done. Compose only injects
      # env vars explicitly listed here -- a host .env value alone is not
      # enough.
      - FERNET_KEY=${FERNET_KEY}
      # CI SMOKE-TEST FIX: opt-in only -- unset in any real .env, this
      # defaults to "0" (real Llama() load, as always). CI sets it to
      # "1" explicitly (see ci.yml's "Start Docker Compose" step) so the
      # health check can pass without downloading multi-GB model weights
      # on every run. See core/llm_runtime.py's __init__ for the actual
      # skip logic this flag controls.
      - TINYAGENT_SKIP_LLM_LOAD=${TINYAGENT_SKIP_LLM_LOAD:-0}

    volumes:
      - tinyagentos_logs:/app/logs
      - ../models:/app/models
      - ../tinyagentos.db:/app/tinyagentos.db

    restart: unless-stopped

    networks:
      - tinyagentos-network

  prometheus:
    image: prom/prometheus:v2.53.0
    # Relative to THIS file's location (docker/), same convention as the
    # ../models volume above -- these paths are docker/prometheus.yml and
    # docker/grafana/provisioning/, not project-root-relative.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - tinyagentos
    restart: unless-stopped
    networks:
      - tinyagentos-network

  grafana:
    image: grafana/grafana:11.1.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      # Change this -- same rule as SECRET_KEY/FERNET_KEY above, don't
      # leave the default in anything that isn't purely local.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tinyagentos-network

networks:
  tinyagentos-network:
    driver: bridge

volumes:
  tinyagentos_logs:
  prometheus_data:
  grafana_data: